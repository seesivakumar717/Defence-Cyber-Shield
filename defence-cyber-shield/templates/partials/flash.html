{% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
    <div class="mb-3">
      {% for category, message in messages %}
        <div class="alert alert-{{ 'danger' if category == 'danger' else category }} d-flex align-items-center gap-2 py-2 px-3" role="alert">
          <i class="bi {{ 'bi-check-circle-fill' if category == 'success' else 'bi-exclamation-triangle-fill' if category in ['danger','warning'] else 'bi-info-circle-fill' }}"></i>
          <span class="small">{{ message }}</span>
        </div>
      {% endfor %}
    </div>
  {% endif %}
{% endwith %}
